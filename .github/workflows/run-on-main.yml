# These set of workflows run on every push to the main branch
name: Main build
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  linting:
    name: Linting
    uses: ./.github/workflows/lint.yml
    secrets: inherit
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
